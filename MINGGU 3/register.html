<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        crimson: "#951D22",
                        burgundy: "#5C171D",
                        dark: "#2C1417",
                        cream: "#F7EAE5",
                        rose: "#A95453",
                        softrose: "#DDA19E"
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-cream text-dark">
    <main class="min-h-screen flex items-center justify-center px-5 py-10">
        <section class="w-full max-w-2xl bg-white/80 backdrop-blur-sm rounded-3xl shadow-2xl overflow-hidden border border-softrose/40">

            <!-- Header -->
            <div class="bg-dark px-8 py-8 text-center">
                <h1 class="text-3xl md:text-4xl font-bold text-cream uppercase mb-2">Create An Account</h1>
                <p class="text-rose mt-2 text-sm">Isi data diri untuk membuat akun baru.</p>
            </div>

            <!-- Form -->
            <form id="registerForm" action="dashboard.html" class="p-7 md:p-10 space-y-5" novalidate>

                <!-- Username -->
                <div>
                    <label for="username" class="block font-semibold mb-2">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        class="w-full rounded-xl border border-softrose px-4 py-3 outline-none focus:ring-2 focus:ring-crimson focus:border-crimson transition"
                    >
                    <p id="usernameError" class="text-red-700 text-sm mt-1 hidden"></p>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block font-semibold mb-2">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        class="w-full rounded-xl border border-softrose px-4 py-3 outline-none focus:ring-2 focus:ring-crimson focus:border-crimson transition"
                    >
                    <p id="passwordError" class="text-red-700 text-sm mt-1 hidden"></p>
                </div>

                <!-- Nama -->
                <div>
                    <label for="nama" class="block font-semibold mb-2">Nama</label>
                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama lengkap"
                        class="w-full rounded-xl border border-softrose px-4 py-3 outline-none focus:ring-2 focus:ring-crimson focus:border-crimson transition"
                    >
                    <p id="namaError" class="text-red-700 text-sm mt-1 hidden"></p>
                </div>

                <!-- Tanggal Lahir -->
                <div>
                    <label for="tanggalLahir" class="block font-semibold mb-2">Tanggal Lahir</label>
                    <input
                        type="date"
                        id="tanggalLahir"
                        name="tanggalLahir"
                        class="w-full rounded-xl border border-softrose px-4 py-3 outline-none focus:ring-2 focus:ring-crimson focus:border-crimson transition"
                    >
                    <p id="tanggalLahirError" class="text-red-700 text-sm mt-1 hidden"></p>
                </div>

                <!-- Alamat -->
                <div>
                    <label for="alamat" class="block font-semibold mb-2">Alamat</label>
                    <textarea
                        id="alamat"
                        name="alamat"
                        rows="3"
                        placeholder="Masukkan alamat"
                        class="w-full rounded-xl border border-softrose px-4 py-3 outline-none focus:ring-2 focus:ring-crimson focus:border-crimson transition resize-none"
                    ></textarea>
                    <p id="alamatError" class="text-red-700 text-sm mt-1 hidden"></p>
                </div>

                <!-- Nomor Telepon -->
                <div>
                    <label for="telepon" class="block font-semibold mb-2">Nomor Telepon</label>
                    <input
                        type="tel"
                        id="telepon"
                        name="telepon"
                        placeholder="Contoh: 628123456789"
                        class="w-full rounded-xl border border-softrose px-4 py-3 outline-none focus:ring-2 focus:ring-crimson focus:border-crimson transition"
                    >
                    <p id="teleponError" class="text-red-700 text-sm mt-1 hidden"></p>
                </div>

                <button
                    type="submit"
                    class="w-full bg-crimson hover:bg-burgundy text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg hover:shadow-xl"
                >
                    Daftar
                </button>
            </form>
        </section>
    </main>

    <script src="validasi_input.js"></script>
</body>
</html>
